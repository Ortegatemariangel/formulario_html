<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Datos del estudiante</title>
</head>
<body>
    <!--Esta es la sección visible de la página web-->
    <h1>REGISTRO DE ESTUDIANTES - ESPECIALIDAD EN SISTEMAS</h1>
    <!--Formulario web-->
    <form action ="#" method ="">
        <!--Sección de datos del estudiante-->
        <fieldset>
            <legend>Datos del estudiante</legend>
            <label for="apellidos">Apellidos:</label>
            <input type="text" id ="apellidos" name="apellidos">
            <label for="nombre">Nombre:</label>
            <input type="text" id="nombre" name="nombre">
        <br>
            <label for="f_nacimiento">Fecha de nacimiento:</label>
            <input type="date" id="f_nacimiento" name="f_nacimiento">
            <label for="l_nacimiento">Lugar de nacimiento:</label>
            <input type="text" id="l_nacimiento" name="l_nacimiento">
        <br>
            <label for="tipo_documento">Tipo Documento de Identidad:</label>
            <select id="tipo_documento" name="tipo_documento">
                <option value="CC">Cédula de Ciudadanía</option>
                <option value="TI">Tarjeta de Identidad</option>
            </select>
            <label for="N_documento">Número Documento Identidad</label>
            <input type="number" id="N_documento" name="N_documento">
        <br>
            <label for="l_expedicion">Lugar Expedición Documento Identidad:</label>
            <input type="text" id="l_expedicion" name="l_expedicion">
        <br>
            <label for="Direccion">Dirección:</label>
            <input type="text" id="Direccion" name="Direccion">
            <label for="Barrio">Barrio:</label>
            <input type="text" id="Barrio" name="Barrio">
            <label for="Ciudad">Ciudad:</label>
            <input type="text" id="Ciudad" name="Ciudad">
        <br>
            <label for="Telefono">Teléfono:</label>
            <input type="number" id="Telefono" name="Telefono">
            <label for="Celular">Celular:</label>
            <input type="number" id="Celular" name="Celular">
        <br>
            <label for="email-personal">E-mail Personal:</label>
            <input type="email" id="email-personal" name="email-personal">
            <label for="email-institucional">E-mail Institucional:</label>
            <input type="email" id="email-institucional" name="email-institucional">
        <br>
            <label for="tipo_sangre">Tipo de sangre:</label>
            <input type="text" id="tipo_sangre" name="tipo_sangre">
            <select id="tipo_sangre" name="tipo_sangre">
                <option value="A+">A+</option>
                <option value="A-">A-</option>
                <option value="B+">B+</option>
                <option value="B-">B-</option>
                <option value="AB+">AB+</option>
                <option value="AB-">AB-</option>
                <option value="O+">O+</option>
                <option value="O-">O-</option>
            </select>
            <label for="EPS">EPS:</label>
            <input type="text" id="EPS" name="EPS">
        <br>
            <label for="enfermedades">¿Sufre alguna enfermedad?:</label>
            <select id="enfermedades" name="enfermedades">
                <option value="si">Sí</option>
                <option value="no">No</option>
            </select>
            <label for="Cual">¿Cuál?</label>
            <input type="text" id="Cual" name="Cual">
        <br>
            <label for="estrato_socioeconomico">Estrato socioeconómico:</label>
            <input type="text" id="estrato_socioeconomico" name="estrato_socioeconomico">
            <label for="Familias en accion">Familias en acción:</label>
            <select id="Familias en accion" name="Familias en accion">
                <option value="si">Sí</option>
                <option value="no">No</option>
            </select>
            
        <br>
            <label for="tipo religion">Tipo de religión:</label>
            <input type="text" id="tipo religion" name="tipo religion">
        <br>
            <label for="relacion padres">Relación Padres:</label>
            <select id="relacion padres" name="relacion padres">
                <option value="Casados">Casados</option>
                <option value="Divorciados">Divorciados</option>
                <option value="Unión libre">Unión libre</option>
            </select>
            <label for="Otro">Otro:</label>
            <input type="text" id="Otro" name="Otro">
        <br>
            <label for="computadora en casa">Computadora en casa:</label>
            <select id="computadora en casa" name="computadora en casa">
                <option value="si">Sí</option>
                <option value="no">No</option>
            </select>
            <label for="internet en casa">Internet en casa:</label>
            <select id="internet en casa" name="internet en casa">
                <option value="si">Sí</option>
                <option value="no">No</option>
            </select>
        <br>
            <label for="¿Cuáles son las principales actividades que usted realiza en su tiempo libre?">¿Cuáles son las principales actividades que usted realiza en su tiempo libre?:</label>
        <br>
            <textarea id="¿Cuáles son las principales actividades que usted realiza en su tiempo libre?" name="¿Cuáles son las principales actividades que usted realiza en su tiempo libre?"></textarea>
        <br>
            <label for="¿Cuáles son sus propósitos y espectativas personales y académicas como estudiante de la Especialidad en Sistemas?">¿Cuáles son sus propósitos y espectativas personales y académicas como estudiante de la Especialidad en Sistemas?:</label>
        <br>
            <textarea id="¿Cuáles son sus propósitos y espectativas personales y académicas como estudiante de la Especialidad en Sistemas?" name="¿Cuáles son sus propósitos y espectativas personales y académicas como estudiante de la Especialidad en Sistemas?"></textarea>
        
    </fieldset>
        <br>

        <fieldset>
            <legend>Datos del padre</legend>
            <label for="apellidos">Apellidos:</label>
            <input type="text" id="apellidos" name="apellidos">
            <label for="nombre">Nombre:</label>
            <input type="text" id="nombre" name="nombre">
        <br>
            <label for="Direccion">Dirección:</label>
            <input type="text" id="Direccion" name="Direccion">
            <label for="Barrio">Barrio:</label>
            <input type="text" id="Barrio" name="Barrio">
        <br>
            <label for="Telefono">Teléfono:</label>
            <input type="text" id="Telefono" name="Telefono">
            <label for="Celular">Celular:</label>
            <input type="text" id="Celular" name="Celular">
        <br>
            <label for="Email">E-mail:</label>
            <input type="email" id="Email" name="Email">
        <br>
            <label for="Ocupacion">Ocupación:</label>
            <input type="text" id="Ocupacion" name="Ocupacion">
    </fieldset>
        <br>
        <fieldset>
            <legend>Datos de la madre</legend>
            <label for="apellidos">Apellidos:</label>
            <input type="text" id="apellidos" name="apellidos">
            <label for="nombre">Nombre:</label>
            <input type="text" id="nombre" name="nombre">
        <br>
            <label for="Direccion">Dirección:</label>
            <input type="text" id="Direccion" name="Direccion">
            <label for="Barrio">Barrio:</label>
            <input type="text" id="Barrio" name="Barrio">
        <br>
            <label for="Telefono">Teléfono:</label>
            <input type="text" id="Telefono" name="Telefono">
            <label for="Celular">Celular:</label>
            <input type="text" id="Celular" name="Celular">
        <br>
            <label for="Email">E-mail:</label>
            <input type="email" id="Email" name="Email">
        <br>
            <label for="Ocupacion">Ocupación:</label>
            <input type="text" id="Ocupacion" name="Ocupacion">
        </fieldset>
        <br>
        <fieldset>
            <legend>Datos del acudientes (persona que asistirá a las reuniones y entregas de boletines; ya sea madre, padre u otro)</legend>
            <label for="apellidos">Apellidos:</label>
            <input type="text" id="apellidos" name="apellidos">
            <label for="nombre">Nombre:</label>
            <input type="text" id="nombre" name="nombre">
            <label for="parentesco">Parentesco:</label>
            <input type="text" id="parentesco" name="parentesco">
        <br>
            <label for="Direccion">Dirección:</label>
            <input type="text" id="Direccion" name="Direccion">
            <label for="Barrio">Barrio:</label>
            <input type="text" id="Barrio" name="Barrio">
        <br>
            <label for="Telefono">Teléfono:</label>
            <input type="text" id="Telefono" name="Telefono">
            <label for="Celular">Celular:</label>
            <input type="text" id="Celular" name="Celular">
        <br>
            <label for="Email">E-mail:</label>
            <input type="email" id="Email" name="Email">
        <br>
            <label for="Ocupacion">Ocupación:</label>
            <input type="text" id="Ocupacion" name="Ocupacion">
    </fieldset>
        <br>
        </fieldset>
        <br>
        <button type="submit">Enviar formulario</button>
        <button type="reset">Limpiar datos</button>
    </form>
</body>
</html>
